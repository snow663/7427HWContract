name: Modular C Pseudo-source Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pseudo-source/**"
      - "hac31_romsim/romsim/**"
      - "tools/factory_*"
      - ".github/workflows/pseudo-source-verification.yml"
  push:
    branches: [main, "work/pseudo-source-development"]
    paths:
      - "pseudo-source/**"
      - "hac31_romsim/romsim/**"
      - "tools/factory_*"
      - ".github/workflows/pseudo-source-verification.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host source checks
        run: cmake -S pseudo-source -B pseudo-source/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE= -DCMAKE_C_FLAGS=-O2
      - name: Compile separate routine files
        run: cmake --build pseudo-source/build --parallel 2
      - name: Test fast source contracts and provenance
        run: ctest --test-dir pseudo-source/build --output-on-failure --parallel 2 --stop-on-failure -E rom_differential
      - name: Compare source with stock ROM
        run: ctest --test-dir pseudo-source/build --output-on-failure --parallel 2 --stop-on-failure -R rom_differential
