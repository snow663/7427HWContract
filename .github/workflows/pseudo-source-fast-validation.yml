name: Pseudo-source Fast Branch Gate
on:
  push:
    branches:
      - "work/pseudo-source-development"
    paths:
      - "pseudo-source/**"
      - "docs/WORKING_STATE.md"
      - ".github/workflows/pseudo-source-fast-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pseudo-source-fast-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure host C pseudo-source
        run: cmake -S pseudo-source -B pseudo-source/build -DBUILD_TESTING=ON
      - name: Compile source and fixtures
        run: cmake --build pseudo-source/build --parallel 2
      - name: Run source contracts without expensive ROM suites
        run: ctest --test-dir pseudo-source/build --output-on-failure --parallel 2 --stop-on-failure -E rom_differential

      - name: Focused BMHM governor C/ROM differential
        run: ctest --test-dir pseudo-source/build --output-on-failure -R '^(fuel_governor_rom_differential|fuel_ignition_rom_differential|fuel_cycle_rom_differential|speed_source_rom_differential|tcc_non_electronic_rom_differential|transmission_d4eb_prefix_rom_differential|transmission_gear_limit_rom_differential|transmission_gear_finalize_rom_differential|transmission_threshold_select_rom_differential)$'

      - name: Reconciliation replay of PR48 ROM evidence
        run: ctest --test-dir pseudo-source/build --output-on-failure --parallel 2 -R '^(timer_stack_guard_rom_differential|egr_control_rom_differential|egr_producers_rom_differential|fuel_controller_rom_differential|slow_fuel_rom_differential|slot_f_rom_differential)$'
