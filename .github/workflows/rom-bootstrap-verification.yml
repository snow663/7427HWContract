name: ROM Bootstrap Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source/replacement_os/**"
      - "tools/verify_rom_bootstrap.py"
      - ".github/workflows/rom-bootstrap-verification.yml"
  push:
    branches:
      - "agent/rom-first-bootstrap"
    paths:
      - "source/replacement_os/**"
      - "tools/verify_rom_bootstrap.py"
      - ".github/workflows/rom-bootstrap-verification.yml"

jobs:
  verify-rom-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify ROM bootstrap structure
        run: python tools/verify_rom_bootstrap.py
