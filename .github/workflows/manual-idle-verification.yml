name: Manual Idle Strategy Verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "source/manual_idle/**"
      - "tools/manual_idle_*.py"
      - "tools/trace_manual_idle.py"
      - "tools/verify_manual_idle_runtime.py"
      - "tools/verify_manual_idle.py"
      - "tests/test_manual_idle.py"
      - "maps/maintenance/manual_idle_*.json"
      - ".github/workflows/manual-idle-verification.yml"
  push:
    branches: [main]
    paths:
      - "source/manual_idle/**"
      - "tools/manual_idle_*.py"
      - "tools/verify_manual_idle.py"
      - "tests/test_manual_idle.py"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Decode strategy and verify generated layout
        run: python tools/manual_idle_overlay.py
      - name: Compare native C and assembled HC11, reset and service contracts
        run: python tools/verify_manual_idle.py --check-recorded
