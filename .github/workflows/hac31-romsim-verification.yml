name: HAC31 ROM Simulator Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hac31_romsim/**"
      - ".github/workflows/hac31-romsim-verification.yml"
  push:
    branches:
      - main
    paths:
      - "hac31_romsim/**"
      - ".github/workflows/hac31-romsim-verification.yml"

permissions:
  contents: read

jobs:
  verify-simulator:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify source and launchers compile
        working-directory: hac31_romsim
        run: python -m compileall -q romsim tests launch_gui.pyw

      - name: Run self-contained simulator and GUI workbench tests
        working-directory: hac31_romsim
        run: python -m unittest discover -s tests -v

      - name: Install package
        working-directory: hac31_romsim
        run: python -m pip install .

      - name: Verify command entry points
        run: |
          hac31-romsim --help
          python -c "import romsim.gui; print(romsim.gui.APP_TITLE)"

