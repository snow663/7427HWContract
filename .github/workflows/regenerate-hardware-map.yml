name: Regenerate Hardware Access Map Outputs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-hardware-map:
    name: Regenerate hardware map outputs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional builder dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas

      - name: Regenerate build_hw_map outputs
        run: |
          python tools/build_hw_map.py

      - name: Show regenerated output diff
        run: |
          git status --short
          git diff -- \
            docs/ASIC_HARDWARE_REGISTER_CONTRACT.md \
            docs/STATIC_ANALYSIS_SUMMARY.md \
            docs/VARIABLE_DEPENDENCY_GRAPH.md \
            maps/current/hardware_access_map_hw_only.csv \
            maps/full/hardware_access_map_v0.3.csv

      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/ASIC_HARDWARE_REGISTER_CONTRACT.md \
            docs/STATIC_ANALYSIS_SUMMARY.md \
            docs/VARIABLE_DEPENDENCY_GRAPH.md \
            maps/current/hardware_access_map_hw_only.csv \
            maps/full/hardware_access_map_v0.3.csv
          if git diff --cached --quiet; then
            echo "No regenerated hardware map output changes to commit."
          else
            git commit -m "Regenerate hardware access map outputs"
            git push origin HEAD:main
          fi

      - name: Verify static artifact builders after regeneration
        run: |
          python tools/verify_static_artifact_builders.py --write-report

      - name: Show verifier report diff
        if: always()
        run: |
          git status --short
          git diff -- maps/tests/static_artifact_builder_verification.csv || true

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-artifact-builder-verification-report
          path: maps/tests/static_artifact_builder_verification.csv
          if-no-files-found: error
