  workflow_dispatch:
  pull_request:
    paths:
      - "tools/factory_structure.py"
      - "tools/factory_rom_overlay.py"
      - "tools/factory_indexed_targets.py"
      - "tools/factory_spark.py"
      - "tools/factory_fuel.py"
      - "tools/factory_fuel_replay.py"
      - "tools/factory_integer_replay.py"
      - "tools/verify_factory_fuel.py"
      - "tools/verify_factory_upstream.py"
      - "tools/verify_factory_idle_governor.py"
      - "tools/verify_factory_dte.py"
      - "tools/verify_factory_serial.py"
      - "tools/verify_factory_global_structure.py"
      - "docs/analysis/FACTORY_SERIAL*.md"
      - "docs/analysis/FACTORY_SERVICE_AND_TEST.md"
      - "docs/analysis/FACTORY_GLOBAL_STRUCTURE_AUDIT.md"
