      - "docs/contracts/IAC_*.md"
      - "maps/contracts/iac_*.csv"
      - "docs/analysis/FACTORY_IAC_*.md"
      - "docs/analysis/FACTORY_RPM_VSS_GOVERNOR.md"
      - "docs/analysis/FACTORY_IDLE_SPEED_CONTROL_CLOSURE.md"
      - "docs/analysis/FACTORY_*CALCULATIONS.md"
      - "docs/analysis/FACTORY_CLOSED_LOOP_AND_LEARNING.md"
      - "docs/analysis/FACTORY_ENGINE_CALCULATION_CLOSURE.md"
      - "tests/test_factory_fuel.py"
      - "tools/factory_spark_replay.py"
      - "tools/verify_factory_spark.py"
      - "tools/build_spark_conversion_equation.py"
      - "tests/test_factory_spark.py"
      - "tests/static/spark_conversion_vectors.csv"
      - "tools/build_factory_structure.py"
      - "tools/verify_factory_rom_structure.py"
      - "tools/build_factory_scheduler.py"
      - "tools/factory_rom_decode.py"
      - "tools/factory_scheduler_replay.py"
      - "tools/factory_state_flow.py"
      - "tools/build_factory_state_flow.py"
      - "hac31_romsim/romsim/hc11_core.py"
      - "hac31_romsim/romsim/profiles/gm_16197427_31.json"
      - "tools/build_full_rom_write_target_sweep.py"
      - "tools/build_per_target_dossier_index.py"
      - "tools/build_dispatcher_reverse_map.py"
      - "tools/build_write_target_network_index.py"
      - "tools/build_subsystem_isolation_index.py"
      - "source/31/**"
      - "maps/structure/**"
      - "tests/test_factory_structure.py"
      - "tests/test_factory_scheduler.py"
      - "tests/test_factory_state_flow.py"
      - ".github/workflows/factory-structure-verification.yml"
  push:
    branches: [main]
    paths:
      - "tools/factory_structure.py"
      - "tools/factory_rom_overlay.py"
      - "tools/factory_indexed_targets.py"
      - "tools/factory_spark.py"
      - "tools/factory_fuel.py"
      - "tools/factory_fuel_replay.py"
      - "tools/factory_integer_replay.py"
      - "tools/verify_factory_fuel.py"
      - "tools/verify_factory_upstream.py"
      - "tools/verify_factory_idle_governor.py"
      - "tools/verify_factory_dte.py"
      - "tools/verify_factory_serial.py"
      - "tools/verify_factory_global_structure.py"
      - "docs/analysis/FACTORY_SERIAL*.md"
      - "docs/analysis/FACTORY_SERVICE_AND_TEST.md"
      - "docs/analysis/FACTORY_GLOBAL_STRUCTURE_AUDIT.md"
      - "tests/test_factory_dte.py"
      - "docs/analysis/FACTORY_DIAGNOSTICS*.md"
      - "docs/analysis/FACTORY_TRANSMISSION_CONTROL.md"
      - "docs/analysis/FACTORY_EMISSIONS_CONTROL.md"
      - "tools/build_iac_output_contract.py"
      - "tools/build_iac_init_park_contract.py"
      - "tools/build_iac_phase_sequence_contract.py"
      - "tools/build_iac_enable_fault_gate_contract.py"
      - "docs/contracts/IAC_*.md"
      - "maps/contracts/iac_*.csv"
      - "docs/analysis/FACTORY_IAC_*.md"
      - "docs/analysis/FACTORY_RPM_VSS_GOVERNOR.md"
      - "docs/analysis/FACTORY_IDLE_SPEED_CONTROL_CLOSURE.md"
      - "docs/analysis/FACTORY_*CALCULATIONS.md"
      - "docs/analysis/FACTORY_CLOSED_LOOP_AND_LEARNING.md"
      - "docs/analysis/FACTORY_ENGINE_CALCULATION_CLOSURE.md"
      - "tests/test_factory_fuel.py"
      - "tools/factory_spark_replay.py"
      - "tools/verify_factory_spark.py"
      - "tools/build_spark_conversion_equation.py"
      - "tests/test_factory_spark.py"
      - "tests/static/spark_conversion_vectors.csv"
      - "tools/build_factory_structure.py"
      - "tools/verify_factory_rom_structure.py"
      - "tools/build_factory_scheduler.py"
      - "tools/factory_rom_decode.py"
      - "tools/factory_scheduler_replay.py"
      - "tools/factory_state_flow.py"
      - "tools/build_factory_state_flow.py"
      - "hac31_romsim/romsim/hc11_core.py"
      - "hac31_romsim/romsim/profiles/gm_16197427_31.json"
      - "tools/build_full_rom_write_target_sweep.py"
      - "tools/build_per_target_dossier_index.py"
      - "tools/build_dispatcher_reverse_map.py"
      - "tools/build_write_target_network_index.py"
      - "tools/build_subsystem_isolation_index.py"
      - "source/31/**"
      - "maps/structure/**"
      - "tests/test_factory_structure.py"
      - "tests/test_factory_scheduler.py"
      - "tests/test_factory_state_flow.py"
      - ".github/workflows/factory-structure-verification.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test factory structure and bounded ROM scheduler execution
        run: python -m unittest discover -s tests -p 'test_factory_*.py' -v
      - name: Check generated structural indexes
        run: python tools/build_factory_structure.py --check
      - name: Check recorded ROM evidence consistency
        run: python tools/verify_factory_rom_structure.py --check-recorded
      - name: Check scheduler outputs against recorded ROM excerpts
        run: python tools/build_factory_scheduler.py --check-recorded
      - name: Check nested calls and indexed state flow against ROM excerpts
        run: python tools/build_factory_state_flow.py --check-recorded
      - name: Check exact spark evidence against recorded ROM excerpts
        run: python tools/verify_factory_spark.py --check-recorded
      - name: Check fuel documentation evidence against recorded ROM excerpts
        run: python tools/verify_factory_fuel.py --check-recorded
      - name: Check upstream engine documentation against recorded ROM excerpts
        run: python tools/verify_factory_upstream.py --check-recorded
      - name: Check IAC RPM VSS and governor documentation against ROM excerpts
        run: python tools/verify_factory_idle_governor.py --check-recorded
      - name: Check diagnostics transmission and emissions documentation against ROM excerpts
        run: python tools/verify_factory_dte.py --check-recorded
      - name: Check SCI ALDL service and factory-test documentation against ROM excerpts
        run: python tools/verify_factory_serial.py --check-recorded
      - name: Check global rooted structure and direct ownership against ROM excerpts
        run: python tools/verify_factory_global_structure.py --check-recorded
      - name: Regenerate earlier IAC contracts with current ROM authority links
        run: |
          python tools/build_iac_output_contract.py --out-md docs/contracts/IAC_IDLE_AIR_OUTPUT_CONTRACT.md --out-csv maps/contracts/iac_idle_air_output_contract.csv
          python tools/build_iac_init_park_contract.py --out-md docs/contracts/IAC_INIT_PARK_CONTRACT.md --out-csv maps/contracts/iac_init_park_contract.csv
          python tools/build_iac_phase_sequence_contract.py --out-md docs/contracts/IAC_PHASE_SEQUENCE_CONTRACT.md --out-csv maps/contracts/iac_phase_sequence_contract.csv
          python tools/build_iac_enable_fault_gate_contract.py --out-md docs/contracts/IAC_ENABLE_FAULT_GATE_CONTRACT.md --out-csv maps/contracts/iac_enable_fault_gate_contract.csv
      - name: Regenerate ROM-backed spark conversion contract
        run: python tools/build_spark_conversion_equation.py --out-md docs/contracts/SPARK_CONVERSION_EQUATION.md --out-csv maps/contracts/spark_conversion_equation.csv --vectors tests/static/spark_conversion_vectors.csv
      - name: Regenerate consumers of reviewed data boundaries
        run: |
          python tools/build_full_rom_write_target_sweep.py
          python tools/build_per_target_dossier_index.py
          python tools/build_dispatcher_reverse_map.py
          python tools/build_write_target_network_index.py
          python tools/build_subsystem_isolation_index.py
          git diff --exit-code
