name: HC11 CPU and target arithmetic regressions
on:
  workflow_dispatch:
  push:
    branches: [main, "work/pseudo-source-development"]
    paths:
      - "hac31_romsim/**"
      - "7427_simulator/**"
      - "pseudo-source/**"
      - "tests/audit/**"
      - "tools/audit/**"
      - "tools/factory_*"
      - "docs/audit/hc11_validation_results.json"
      - ".github/workflows/cpu-arithmetic-regressions.yml"
  pull_request:
    paths:
      - "hac31_romsim/**"
      - "7427_simulator/**"
      - "pseudo-source/**"
      - "tests/audit/**"
      - "tools/audit/**"
      - "tools/factory_*"
      - "docs/audit/hc11_validation_results.json"
      - ".github/workflows/cpu-arithmetic-regressions.yml"
permissions:
  contents: read
concurrency:
  group: cpu-arithmetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install syntax parser for target-width expression tests
        run: python -m pip install pycparser==3.00
      - name: Prove the pinned baseline fails the focused regressions
        run: |
          git worktree add --detach "$RUNNER_TEMP/cpu-arithmetic-baseline" f2f493f4df5843d37baf23d27a460dbd7d890476
          python tools/audit/reproduce_baseline.py --repo "$RUNNER_TEMP/cpu-arithmetic-baseline" --out "$RUNNER_TEMP/cpu-arithmetic-evidence/baseline"
      - name: Check both CPUs against the independent ISA catalogue
        run: python -m unittest discover -s tests/audit -p test_hc11_isa.py -v
      - name: Check interrupt request admission and cancellation
        run: python -m unittest discover -s tests/audit -p test_interrupt_scheduling.py -v
      - name: Check actual source expressions with 16-bit int semantics
        run: python -m unittest discover -s tests/audit -p test_target_arithmetic.py -v
      - name: Run existing newer CPU wrapper tests
        working-directory: 7427_simulator
        run: python -m unittest discover -s tests -v
      - name: Validate production C and affected host contracts
        run: python tools/audit/verify_target_arithmetic_host.py --jobs 2
      - name: Build the knock fixture with assertions enabled
        run: |
          cmake -S pseudo-source -B pseudo-source/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE= -DCMAKE_C_FLAGS=-O2
          cmake --build pseudo-source/build --target pcm_knock_tests --parallel 2
      - name: Reproduce the old harness's exact lost post-CLI request
        run: python tools/audit/reproduce_knock_irq_harness.py --host-binary pseudo-source/build/pcm_knock_tests --expect-mismatch > "$RUNNER_TEMP/cpu-arithmetic-evidence/knock-before.json"
      - name: Require architectural admission in corrected knock IRQ witnesses
        run: python pseudo-source/tests/compare_knock_rom.py pseudo-source/build/pcm_knock_tests --irq-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-arithmetic-regression-evidence
          path: ${{ runner.temp }}/cpu-arithmetic-evidence
